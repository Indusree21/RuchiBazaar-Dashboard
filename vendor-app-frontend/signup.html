<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup - RuchiBazaar</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6" id="role-title">Create Your Account</h2>
            
    <!-- Role selection -->
    <div class="mb-6 text-center" id="roleSelection">
      <p class="mb-2 text-gray-700 font-medium">I am a:</p>
      <div class="flex justify-center gap-4">
        <button id="vendorBtn" onclick="selectRole('vendor')" class="px-4 py-2 border rounded-md text-gray-700 hover:bg-indigo-100">Vendor</button>
        <button id="supplierBtn" onclick="selectRole('supplier')" class="px-4 py-2 border rounded-md text-gray-700 hover:bg-green-100">Supplier</button>
      </div>
    </div>

    <!-- Signup Form -->
    <form id="signupForm" class="space-y-4 hidden">
      <input type="hidden" id="role" name="role" />

      <div>
        <label class="block text-sm font-medium text-gray-600">Full Name</label>
        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Phone Number</label>
        <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">Signup</button>

      <!-- Already have an account? -->
      <div class="mt-4 text-center text-sm text-gray-600">
        Already have an account? 
        <a href="login.html" class="text-indigo-600 hover:underline font-medium">Login here</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const roleInput = document.getElementById('role');
    const roleTitle = document.getElementById('role-title');
    const roleSelection = document.getElementById('roleSelection');
    const vendorBtn = document.getElementById('vendorBtn');
    const supplierBtn = document.getElementById('supplierBtn');

    function selectRole(role) {
      roleInput.value = role;
      form.classList.remove('hidden');
      roleTitle.innerText = `Signup as ${capitalize(role)}`;

      vendorBtn.classList.remove('bg-indigo-200');
      supplierBtn.classList.remove('bg-green-200');

      if (role === 'vendor') {
        vendorBtn.classList.add('bg-indigo-200');
      } else {
        supplierBtn.classList.add('bg-green-200');
      }
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const params = new URLSearchParams(window.location.search);
    const autoRole = params.get("role");
    if (autoRole === "vendor" || autoRole === "supplier") {
      selectRole(autoRole);
      roleSelection.classList.add("hidden");
    }

    // Backend Signup
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = roleInput.value;

      try {
        const res = await fetch("http://localhost:5000/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone, password, role })
        });

        const data = await res.json();
        console.log("Signup response:", data);

        if (res.ok) {
          // Verify we have the _id before storing
          if (!data._id) {
            alert("Error: User ID not received from server. Please try again.");
            return;
          }

          localStorage.setItem("user", JSON.stringify(data));
          console.log("User stored in localStorage:", data);

          alert(`Signed up successfully as ${capitalize(role)}!`);
          window.location.href = role === "vendor" ? "vendor-info.html" : "supplier-info.html";
        } else {
          alert(data.message || "Signup failed.");
        }
      } catch (err) {
        console.error("Signup error:", err);
        alert("Server error. Please try again.");
      }
    });
  </script>
</body>
</html>
