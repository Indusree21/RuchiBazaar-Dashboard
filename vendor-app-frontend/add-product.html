<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product - Supplier</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap');

    body {
      background: linear-gradient(to bottom right, #f0fdf4, #dcfce7); /* very light green */
    }

    .highlight-title {
      font-family: 'Playfair Display', serif;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 1rem;
      backdrop-filter: blur(10px);
      padding: 2rem;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="w-full max-w-xl glass-box shadow-xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl highlight-title text-gray-800">➕ Add New Product</h1>
      <a href="supplier-dashboard.html" class="text-blue-600 hover:underline">← Back</a>
    </div>

    <form id="productForm" class="space-y-5">
      <div>
        <label class="block text-sm text-gray-700">Product Name</label>
        <input type="text" id="productName" required class="w-full mt-1 px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-green-400" />
      </div>

      <div>
        <label class="block text-sm text-gray-700">Category</label>
        <select id="productCategory" required class="w-full mt-1 px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-green-400">
          <option value="" disabled selected>Select Category</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Fruits">Fruits</option>
          <option value="Grains">Grains</option>
          <option value="Spices">Spices</option>
          <option value="Dairy">Dairy</option>
          <option value="Beverages">Beverages</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-700">Quantity</label>
        <div class="flex gap-2 mt-1">
          <input type="number" id="productQty" required min="1" class="w-full px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Enter quantity" />
          <select id="quantityUnit" required class="px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-green-400">
            <option value="kg">kg</option>
            <option value="gram">gram</option>
            <option value="litres">litres</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-700">Price (₹ per kg/litre/gram)</label>
        <input type="number" id="productPrice" required min="1" class="w-full mt-1 px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Price for selected unit" />
      </div>

      <div>
        <label class="block text-sm text-gray-700">Upload Product Image</label>
        <input type="file" id="productImage" accept="image/*" required class="w-full mt-1 text-gray-700" />
      </div>

      <button type="submit" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition">
        Add Product
      </button>
    </form>

    <p id="statusMessage" class="mt-4 text-center text-green-600 font-semibold"></p>
  </div>

  <!-- Chatbot -->
  <script src="chatbot.js"></script>

  <script>
    const form = document.getElementById('productForm');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const supplierId = localStorage.getItem('supplierId');
      const name = document.getElementById('productName').value.trim();
      const category = document.getElementById('productCategory').value;
      const quantityType = document.getElementById('quantityUnit').value;
      const quantity = document.getElementById('productQty').value.trim();
      const price = document.getElementById('productPrice').value.trim();
      const imageInput = document.getElementById('productImage');
      const imageFile = imageInput.files.length > 0 ? imageInput.files[0] : null;

      if (!supplierId) {
        statusMessage.textContent = "Supplier ID missing. Please log in again.";
        return;
      }

      if (!name || !category || !quantityType || !quantity || !price || !imageFile) {
        statusMessage.textContent = "Please fill in all required fields.";
        return;
      }

      const formData = new FormData();
      formData.append('supplierId', supplierId);
      formData.append('name', name);
      formData.append('category', category);
      formData.append('quantityType', quantityType);
      formData.append('quantity', quantity);
      formData.append('price', price);
      formData.append('image', imageFile);

      try {
        const response = await fetch('http://localhost:5000/api/products/add', {

          method: 'POST',
          body: formData,
        });

        const data = await response.json();

        if (response.ok) {
          alert('✅ Product added successfully!');
          form.reset();
          statusMessage.textContent = '';
        } else {
          statusMessage.textContent = data.message || "❌ Error adding product.";
        }
      } catch (error) {
        statusMessage.textContent = "❌ Server error. Please try again.";
        console.error(error);
      }
    });
  </script>

</body>
</html>
