<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - RuchiBazaar</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-xl font-bold text-center text-indigo-700 mb-6">Forgot Password</h2>

    <form id="forgotPasswordForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-600">Enter your registered phone number</label>
        <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-indigo-400" />
      </div>

      <div>
        <label class="block text-sm text-gray-600">New Password</label>
        <input type="password" id="newPassword" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-indigo-400" />
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700">Reset Password</button>

      <div class="text-center mt-4">
        <a href="login.html" class="text-indigo-500 hover:underline text-sm">Back to Login</a>
      </div>
    </form>
  </div>

  <script>
  const form = document.getElementById('forgotPasswordForm');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const phone = document.getElementById('phone').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();

    let users = JSON.parse(localStorage.getItem("users")) || [];

    const userIndex = users.findIndex(u => u.phone === phone);

    if (userIndex !== -1) {
      users[userIndex].password = newPassword;
      localStorage.setItem("users", JSON.stringify(users));
      alert("Password reset successfully!");
      window.location.href = "login.html";
    } else {
      alert("Phone number not found. Please check and try again.");
    }
  });
</script>

</body>
</html>
